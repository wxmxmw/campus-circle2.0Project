spring.application.name=campus-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
spring.profiles.default=local

# Only health is exposed publicly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
upload.path=${UPLOAD_PATH:./uploads}
server.url=${SERVER_URL:http://localhost:8080}

# Required for every run. Use a unique random value of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

ai.openai.api-key=${OPENAI_API_KEY:${LLM_API_KEY:}}
ai.openai.model=${OPENAI_MODEL:${LLM_MODEL:gpt-4.1-mini}}
ai.openai.base-url=${OPENAI_BASE_URL:${LLM_BASE_URL:https://api.openai.com/v1}}
ai.openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:${LLM_CONNECT_TIMEOUT_SECONDS:15}}
ai.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:${LLM_REQUEST_TIMEOUT_SECONDS:60}}
ai.openai.proxy-host=${OPENAI_PROXY_HOST:}
ai.openai.proxy-port=${OPENAI_PROXY_PORT:0}
ai.review.enabled=${AI_REVIEW_ENABLED:true}
ai.review.semantic-check.enabled=${AI_REVIEW_SEMANTIC_CHECK_ENABLED:true}
ai.review.semantic-check.model=${AI_REVIEW_SEMANTIC_MODEL:${OPENAI_MODEL:${LLM_MODEL:gpt-4.1-mini}}}
ai.review.threshold.medium=${AI_REVIEW_THRESHOLD_MEDIUM:2}

info.app.name=Campus Circle
info.app.description=Campus community API
info.app.version=1.0.0
