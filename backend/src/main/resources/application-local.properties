spring.boot.admin.client.enabled=false

spring.datasource.url=jdbc:h2:file:./data/campus-circle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.redis.enabled=${APP_REDIS_ENABLED:false}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

logging.file.name=./logs/campus-backend.log
upload.path=./uploads
server.url=http://localhost:8080

ai.openai.api-key=${OPENAI_API_KEY:${LLM_API_KEY:}}
ai.openai.model=${OPENAI_MODEL:${LLM_MODEL:gpt-4.1-mini}}
ai.openai.base-url=${OPENAI_BASE_URL:${LLM_BASE_URL:https://api.openai.com/v1}}
ai.openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:${LLM_CONNECT_TIMEOUT_SECONDS:15}}
ai.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:${LLM_REQUEST_TIMEOUT_SECONDS:60}}
ai.openai.proxy-host=
ai.openai.proxy-port=0

ai.review.enabled=true
ai.review.semantic-check.enabled=false
ai.review.semantic-check.model=${AI_REVIEW_SEMANTIC_MODEL:${OPENAI_MODEL:${LLM_MODEL:gpt-4.1-mini}}}
ai.review.threshold.medium=2
